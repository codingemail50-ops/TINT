apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

group = 'expo.modules.tintappblocker'
version = '1.0.0'

def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
// Without this call, `android.compileSdkVersion` is never set at all — AGP
// then fails this module (and cascades into failing the whole shared
// react-native/expo autolinking configuration step for every other native
// module in the project, since it applies to all of them in one pass).
useDefaultAndroidSdkVersions()

android {
  namespace "expo.modules.tintappblocker"

  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  implementation "androidx.core:core-ktx:1.13.1"
}
