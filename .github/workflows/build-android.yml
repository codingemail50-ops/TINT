name: Build Android APK

# Manual only — clicking "Run workflow" on GitHub (Actions tab -> Build
# Android APK -> Run workflow, pick your branch) is what starts a build.
# It does not run on every push: most commits are JS/UI-only and don't need
# a native rebuild to check, and this repo has no committed android/ folder
# (Expo generates it fresh every run — "prebuild" below) so a build here
# takes several minutes, not seconds. Trigger it only when there's a native
# change (this module, permissions in app.json, a new native dependency) you
# actually need to test on a real device.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Every run so far has hung indefinitely (multiple hours, no output,
      # not even responding cleanly to a cancel) at exactly the Gradle build
      # step below -- a silent hang with zero error is the classic symptom of
      # Gradle blocking on an interactive Android SDK license prompt that a
      # non-interactive CI shell can never answer. GitHub-hosted runners ship
      # with a preinstalled SDK whose licenses are accepted for exactly the
      # components that shipped with it; the first time the Android Gradle
      # Plugin needs to auto-download anything outside that set (a specific
      # platform or build-tools version this project's dependencies ask for),
      # it can hit a license it was never told to accept. This step accepts
      # every license non-interactively up front, so that can't happen.
      - name: Accept Android SDK licenses
        uses: android-actions/setup-android@v3

      - name: Install JS dependencies
        run: npm ci

      # These three are EXPO_PUBLIC_* values — inlined into the JS bundle at
      # build time, not read at runtime, so they have to exist as a .env file
      # (or shell env vars) before the bundling step further down, not just
      # somewhere in the app's config. None of the three are secret in the
      # sense of needing to stay hidden (the Supabase anon key is meant to be
      # public and is safe under RLS; the Google client id is a public OAuth
      # client id) — they're kept as repo secrets anyway so they don't have
      # to live in the workflow file or be typed in by hand on every change.
      # Missing/blank values won't fail this build — Supabase/Google Sign-In
      # just won't work in the resulting APK, everything else will.
      - name: Write build-time env file
        run: |
          cat > .env <<EOF
          EXPO_PUBLIC_SUPABASE_URL=${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID=${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
          EOF

      # Generates the android/ project fresh from app.json plus every native
      # module listed in package.json (including tint-app-blocker, autolinked
      # from modules/) — this repo never commits android/, so this step is
      # what turns "the JS project" into something Gradle can build at all.
      # plugins/withAndroidReleaseSigning.js runs as part of this and is what
      # wires the real keystore (decoded below) into the generated
      # build.gradle in place of Expo's default debug-signs-everything setup.
      - name: Prebuild native Android project
        timeout-minutes: 5
        run: npx expo prebuild --platform android --clean

      # Decodes the real upload keystore from a repo secret into a file on
      # the runner. Nothing here is written to the repo or to a log — GitHub
      # masks any line containing a secret's value automatically. Always
      # runs, even before the secret exists: an empty secret decodes to an
      # empty file, which is harmless because the Build step below only
      # points at this file at all once the secret is actually set (see the
      # TINT_UPLOAD_STORE_FILE ternary there) — an empty *path* is what
      # triggers the plugin's debug-keystore fallback, not an empty file.
      - name: Decode signing keystore
        run: echo "${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}" | base64 -d > android/app/tint-upload.keystore

      # assembleRelease, not assembleDebug: a debug-variant APK expects a
      # live Metro server and is useless once you walk away from a laptop,
      # which is the whole point of testing something like a schedule that
      # has to keep working overnight or across a locked screen. Release
      # bundles the JS in and applies the minify/shrink settings from
      # app.json's expo-build-properties, so this is the same code path
      # production will use.
      #
      # TINT_UPLOAD_STORE_FILE etc. are what withAndroidReleaseSigning reads
      # (see plugins/withAndroidReleaseSigning.js) — when the keystore secret
      # above is set, this signs with the real, permanent upload key, so
      # Google Sign-In and everything else behaves exactly as the actual
      # Play Store submission will. When it isn't set, these env vars point
      # at a file that doesn't exist and the plugin's fallback silently signs
      # with the debug keystore instead — good enough for a UI/logic check,
      # just don't expect Google Sign-In to work in that build.
      # timeout-minutes turns "hangs silently for hours" into "fails clearly
      # within 20 minutes" if the license fix above isn't the whole story --
      # every run before this one sat in_progress until manually cancelled,
      # with no error and no way to tell it apart from a build that was just
      # slow. A bounded failure is strictly more debuggable than that, no
      # matter what the underlying cause turns out to be.
      - name: Build release APK
        working-directory: android
        timeout-minutes: 20
        env:
          # Empty string, not just unset, when the secret isn't configured
          # yet -- Groovy's `if (System.getenv(...))` treats "" the same as
          # null (both falsy), so this is what actually triggers the
          # plugin's fallback to the debug keystore rather than trying (and
          # failing) to sign with a keystore file that's empty or missing.
          TINT_UPLOAD_STORE_FILE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 != '' && 'tint-upload.keystore' || '' }}
          TINT_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          TINT_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          TINT_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      # Prints the SHA-1 of whatever certificate actually signed this APK,
      # straight from the built file rather than trusting which branch of
      # the fallback ran. Not sensitive — a certificate's fingerprint is
      # exactly what gets shared with Google, never masked or secret — so
      # this is safe to leave visible in the log for both of us to check.
      - name: Print signing certificate fingerprint
        run: |
          keytool -printcert -jarfile android/app/build/outputs/apk/release/app-release.apk \
            | grep -A1 "^Certificate fingerprints" || true
          keytool -printcert -jarfile android/app/build/outputs/apk/release/app-release.apk \
            | grep "SHA1:" || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tint-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14
